<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Zoom meeting?</title>
  </head>
  <body>
    <main>
      <strong>Zoom meeting detected</strong>
      <p id="message" role="status">Start a new note and record this meeting?</p>
      <footer>
        <button id="dismiss" type="button">Not now</button>
        <button id="record" type="button">Record</button>
      </footer>
    </main>
    <script type="module" src="/src/meetingPrompt.ts"></script>
  </body>
</html>

[package]
name = "humla-windows"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = "0.16"
symphonia = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
dunce = "1"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
dirs = "5"
tempfile = "3"
wasapi = "0.26"
windows = { version = "0.62.2", features = ["Devices_Enumeration", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Security_Authentication_Identity", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "audio-capture"
path = "src/bin/audio-capture.rs"

[[bin]]
name = "speaker-diarize"
path = "src/bin/speaker-diarize.rs"
